<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resell">
<meta name="theme-color" content="#07090A">
<title>Resell Academy</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:#07090A}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:#EEF2F0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.wrap{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;min-height:100vh}
.glow{position:absolute;width:510px;height:460px;pointer-events:none;z-index:0}
.wrap>*{position:relative;z-index:1}
.wrap>.glow{position:absolute;z-index:0}
.sora{font-family:Sora,sans-serif}
.muted{color:#9BA8A3}
.card{border-radius:24px;padding:18px;background:#111615;border:1px solid #1E2826}
.lbl{font-size:12px;font-weight:600;letter-spacing:1.2px;color:#9BA8A3}
.top{display:flex;align-items:center;justify-content:space-between}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600}
.back{width:44px;height:44px;border-radius:14px;background:#111615;border:1px solid #1E2826;display:flex;align-items:center;justify-content:center}
.hdr{display:flex;justify-content:space-between;align-items:baseline}
.h2{font-family:Sora,sans-serif;font-weight:700;font-size:17px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:18px;font-weight:700;font-size:15px}
.page{display:none}
.page.on{display:flex}
footer{font-size:11px;color:#5E6B66;text-align:center;padding-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbxGgQQ56FQnRyI_j4GsTRYlJP9y42Ts1y--1hw29EF6D2jv8tETrpol9VHBfGPCAFbs/exec';
var K=(location.search.match(/[?&]k=([^&]+)/)||[])[1];
try{if(K)localStorage.setItem('k',K);else K=localStorage.getItem('k')}catch(e){}
var META=7;
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var SEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var NIVEIS=[
  {n:'Iniciante',min:0,g:'linear-gradient(145deg,#3A4542,#1A2321)',c:'#9BA8A3',glow:'rgba(155,168,163,.12)'},
  {n:'Bronze',min:250,g:'linear-gradient(145deg,#FDBA74,#9A3412)',c:'#FDBA74',glow:'rgba(253,186,116,.18)'},
  {n:'Prata',min:500,g:'linear-gradient(145deg,#F1F5F9 0%,#94A3B8 55%,#475569 100%)',c:'#CBD5E1',glow:'rgba(203,213,225,.18)'},
  {n:'Ouro',min:1000,g:'linear-gradient(145deg,#FDE68A,#B45309)',c:'#FBBF24',glow:'rgba(251,191,36,.2)'},
  {n:'Lenda',min:2000,g:'linear-gradient(145deg,#A7F3D0,#7C3AED)',c:'#C4B5FD',glow:'rgba(196,181,253,.2)'}
];
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function seg(d){return add(d,-((d.getDay()+6)%7))}
function eur(x,dec){var neg=x<0;x=Math.abs(x);var v=(Math.round(x*100)/100).toFixed(dec===0?0:2).split('.');v[0]=v[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+v.join(',')+' €'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ico(p,col,s,w){return '<svg aria-hidden="true" width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
var I={
  logo:'<rect x="7" y="3" width="10" height="18" rx="2.5"></rect><path d="M3 9a9 9 0 0 1 3-5"></path><path d="M21 15a9 9 0 0 1-3 5"></path>',
  star:'<path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"></path>',
  up:'<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>',
  fire:'<path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path>',
  arrow:'<path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>',
  back:'<path d="M15 6l-6 6 6 6"></path>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2.5"></rect><path d="M11 18h2"></path>',
  warn:'<path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>',
  trophy:'<path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path>',
  money:'<path d="M12 2v20"></path><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>',
  check:'<path d="M20 6L9 17l-5-5"></path>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>',
  target:'<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle>',
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path>'
};

function calc(D){
  var hoje=parse(D.agora.slice(0,10)), t=iso(hoje), cnt={};
  D.compras.forEach(function(c){cnt[c.d]=(cnt[c.d]||0)+1});
  var m=seg(hoje), wk=0;
  for(var i=0;i<7;i++){var di=iso(add(m,i)); if(di<=t) wk+=cnt[di]||0}
  function semana(mm){var q=0;for(var j=0;j<7;j++)q+=cnt[iso(add(mm,j))]||0;return q}
  var ss=0,w=1; while(semana(add(m,-7*w))>=META){ss++;w++} if(wk>=META) ss++;
  var rows=[],best6=0; for(var x=6;x>=1;x--){var mm=add(m,-7*x),q=semana(mm);rows.push({m:mm,p:q});if(q>best6)best6=q}
  var datas=Object.keys(cnt).sort(), bestAll=wk, metaAlguma=wk>=META;
  if(datas.length){for(var s=seg(parse(datas[0]));s<m;s=add(s,7)){var q2=semana(s);if(q2>bestAll)bestAll=q2;if(q2>=META)metaAlguma=true}}
  var key=hoje.getFullYear()+'-'+pad(hoje.getMonth()+1), pmD=new Date(hoje.getFullYear(),hoje.getMonth()-1,1), pkey=pmD.getFullYear()+'-'+pad(pmD.getMonth()+1);
  var itens=D.itens||[];
  function st(k){var a=itens.filter(function(x){return x.m===k}),v=a.filter(function(x){return x.v>0});
    return {a:a,v:v,lucro:v.reduce(function(s,x){return s+x.l},0),fat:v.reduce(function(s,x){return s+x.v},0),inv:a.reduce(function(s,x){return s+x.c},0)}}
  var c=st(key), p=st(pkey), dim=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
  var meses={}; itens.forEach(function(x){if(x.v>0)meses[x.m]=(meses[x.m]||0)+x.l});
  var mesMil=Object.keys(meses).some(function(k){return meses[k]>=1000});
  var cem=itens.filter(function(x){return x.v>0&&x.l>=100}).sort(function(a,b){return b.l-a.l})[0];
  var best=c.v.slice().sort(function(a,b){return b.l-a.l})[0];
  var nv=itens.filter(function(x){return !(x.v>0)||/^entregue$/i.test(x.e)}), g={ch:0,ca:0,av:0,en:0,rec:0,luc:0}, parados=[];
  nv.forEach(function(x){var e=x.e.toLowerCase();
    if(/^entregue$/.test(e)){g.en++;var vv=(x.v>0?x.v:(x.pv||0));g.rec+=vv;if(vv>0)g.luc+=vv-x.c}
    else if(/enviado|espera|levantar/.test(e))g.ch++;
    else{ if(/venda/.test(e))g.av++; else g.ca++; parados.push({x:x,dias:x.d?Math.round((hoje-parse(x.d))/864e5):null,venda:/venda/.test(e)}) }});
  parados.sort(function(a,b){return (b.dias||0)-(a.dias||0)});
  var nivel=0; NIVEIS.forEach(function(n,i){if(c.lucro>=n.min)nivel=i});
  return {hoje:hoje,wk:wk,ss:ss,rows:rows,best6:best6,bestAll:bestAll,metaAlguma:metaAlguma,c:c,p:p,dim:dim,pm:pmD,mesMil:mesMil,cem:cem,best:best,nv:nv,g:g,parados:parados,nivel:nivel,
    cap:nv.reduce(function(s,x){return s+x.c},0), prev:c.lucro/hoje.getDate()*dim};
}

function inicio(S){
  var N=NIVEIS[S.nivel], c=S.c, R1=120, C1=2*Math.PI*R1, R2=96, C2=2*Math.PI*R2;
  var f1=S.p.lucro>0?Math.min(1,c.lucro/S.p.lucro):(c.lucro>0?1:0), f2=Math.min(1,S.wk/META);
  var pct=S.p.lucro>0?Math.round(c.lucro/S.p.lucro*100):null, pmn=MESES[S.pm.getMonth()];
  var H=110, hmax=Math.max(S.best6,META,1), bars='', lbls='';
  S.rows.forEach(function(r){var ok=r.p>=META, top=r.p===S.best6&&ok;
    bars+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%"><span style="font-size:12px;'+(ok?'font-weight:600;color:#FBBF24':'color:#9BA8A3')+'">'+r.p+'</span><div style="width:100%;height:'+Math.max(6,r.p/hmax*H)+'px;border-radius:8px;background:'+(ok?'linear-gradient(180deg,#FCD34D,#D97706)':'#26302D')+(top?';box-shadow:0 0 24px rgba(251,191,36,.35)':'')+'"></div></div>';
    lbls+='<span>'+pad(r.m.getDate())+'/'+pad(r.m.getMonth()+1)+'</span>'});
  var metaY=META/hmax*H;
  return '<div class="glow" style="top:-140px;left:-60px;background:radial-gradient(closest-side,rgba(61,220,132,.22),rgba(61,220,132,0) 70%)"></div>'+
  '<div class="top"><div style="display:flex;align-items:center;gap:10px"><div style="width:40px;height:40px;border-radius:12px;background:#3DDC84;display:flex;align-items:center;justify-content:center">'+ico(I.logo,'#06210F',22,2.2)+'</div>'+
    '<div style="display:flex;flex-direction:column"><span class="sora" style="font-weight:700;font-size:17px;letter-spacing:-.2px">Resell Academy</span><span style="font-size:12px" class="muted">'+SEM[S.hoje.getDay()]+', '+S.hoje.getDate()+' de '+MESES[S.hoje.getMonth()]+'</span></div></div>'+
    '<a href="#nivel" class="chip" style="background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#FBBF24">'+ico(I.star,'#FBBF24',14,2.2)+N.n+' · Nív. '+S.nivel+'</a></div>'+
  '<div style="border-radius:28px;padding:22px 18px 20px;background:linear-gradient(180deg,#111816 0%,#0C1110 100%);border:1px solid #1E2826;display:flex;flex-direction:column;align-items:center;gap:14px">'+
    '<div style="position:relative;width:280px;height:280px"><svg role="img" aria-label="Lucro do mês e compras da semana" width="280" height="280" viewBox="0 0 280 280"><defs><linearGradient id="gL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF0B0"></stop><stop offset="1" stop-color="#22C55E"></stop></linearGradient><linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"></stop><stop offset="1" stop-color="#F59E0B"></stop></linearGradient></defs>'+
      '<circle cx="140" cy="140" r="'+R1+'" fill="none" stroke="#1A2321" stroke-width="16"></circle>'+(f1>0?'<circle cx="140" cy="140" r="'+R1+'" fill="none" stroke="url(#gL)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+(C1*f1)+' '+C1+'" transform="rotate(-90 140 140)"></circle>':'')+
      '<circle cx="140" cy="140" r="'+R2+'" fill="none" stroke="#1A2321" stroke-width="12"></circle>'+(f2>0?'<circle cx="140" cy="140" r="'+R2+'" fill="none" stroke="url(#gC)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C2*f2)+' '+C2+'" transform="rotate(-90 140 140)"></circle>':'')+'</svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="lbl">LUCRO '+MESES[S.hoje.getMonth()].toUpperCase()+'</span>'+
      '<span class="sora" style="font-weight:800;font-size:54px;letter-spacing:-2px;color:#F4FFF8">'+eur(c.lucro,0).replace(' €','')+'<span style="font-size:30px;color:#3DDC84"> €</span></span>'+
      '<span style="font-size:13px" class="muted">'+(pct!==null?pct+'% de '+pmn:'primeiro mês')+'</span></div></div>'+
    '<div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:99px;background:#3DDC84"></span><span style="font-size:13px;color:#C9D3CF">Lucro vs '+pmn.slice(0,3)+'.</span></div>'+
    '<div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:99px;background:#FBBF24"></span><span style="font-size:13px;color:#C9D3CF">Compras '+S.wk+'/'+META+(S.wk>=META?' ✓':'')+'</span></div></div></div>'+
  '<div style="border-radius:22px;padding:16px 18px;background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.3);display:flex;align-items:center;gap:14px">'+
    '<div style="width:44px;height:44px;border-radius:14px;background:rgba(61,220,132,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+ico(I.up,'#3DDC84',22)+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:600;letter-spacing:1px;color:#7CF0B0">PREVISÃO</span><span style="font-size:15px;line-height:1.35">Ao ritmo atual fechas '+MESES[S.hoje.getMonth()]+' com <b class="sora" style="color:#3DDC84">~'+eur(S.prev,0)+'</b> de lucro</span></div></div>'+
  '<div class="g2"><div style="border-radius:22px;padding:16px;background:linear-gradient(160deg,#2A1A0C 0%,#141110 70%);border:1px solid #3A2614;display:flex;flex-direction:column;gap:10px">'+ico(I.fire,'#FB923C',30)+
      '<span class="sora" style="font-weight:800;font-size:32px;letter-spacing:-1px">'+S.ss+'</span><span style="font-size:13px;color:#C9B8A8">'+(S.ss===1?'semana na meta':'semanas seguidas na meta')+'</span></div>'+
    '<div class="card" style="border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px">'+ico(I.arrow,'#60A5FA',30)+
      '<span class="sora" style="font-weight:800;font-size:32px;letter-spacing:-1px">'+(c.a.length?Math.round(c.v.length/c.a.length*100):0)+'<span style="font-size:18px" class="muted">%</span></span><span style="font-size:13px" class="muted">rotação: '+c.v.length+' vendidos de '+c.a.length+'</span></div></div>'+
  '<div class="card" style="display:flex;flex-direction:column;gap:16px"><div class="hdr"><span class="h2">Últimas semanas</span><span style="font-size:12px" class="muted">recorde <b style="color:#FBBF24">'+S.best6+'</b></span></div>'+
    '<div style="position:relative;height:'+(H+24)+'px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end">'+
      '<div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:'+metaY+'px;border-top:1.5px dashed rgba(251,191,36,.55)"></div><span aria-hidden="true" style="position:absolute;left:0;bottom:'+(metaY-7)+'px;font-size:10px;font-weight:600;color:#FBBF24;background:#111615;padding:0 4px 0 0">meta '+META+'</span>'+bars+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;text-align:center;font-size:11px;color:#7E8B86;margin-top:-6px">'+lbls+'</div></div>'+
  '<div class="card" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px">'+
    '<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px" class="muted">Faturação</span><span class="sora" style="font-weight:700;font-size:20px">'+eur(c.fat)+'</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px" class="muted">Lucro médio/venda</span><span class="sora" style="font-weight:700;font-size:20px">'+(c.v.length?eur(c.lucro/c.v.length):'—')+'</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px" class="muted">Investido</span><span class="sora" style="font-weight:700;font-size:20px">'+eur(c.inv)+'</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px" class="muted">Melhor venda</span><span class="sora" style="font-weight:700;font-size:20px;color:#3DDC84">'+(S.best?'+'+eur(S.best.l):'—')+'</span>'+(S.best?'<span style="font-size:11px;color:#7E8B86">'+esc(S.best.p)+'</span>':'')+'</div></div>'+
  '<a href="#stock" class="btn" style="background:#3DDC84;color:#06210F">Ver stock '+ico(I.arrow,'#06210F',18,2.4)+'</a>';
}

function stock(S){
  var g=S.g, cards='';
  S.parados.forEach(function(o){var d=o.dias, col=d===null?'#7E8B86':d>21?'#F87171':d>=14?'#FB923C':'#3DDC84', bc=d===null?'#1E2826':d>21?'rgba(248,113,113,.45)':d>=14?'rgba(251,146,60,.4)':'#1E2826';
    var txt=d===null?'sem data':d>21?'+21 dias · baixa o preço ou republica':d>=14?'14–21 dias · atenção':'menos de 14 dias · tudo bem';
    cards+='<div style="border-radius:22px;padding:12px;background:#111615;border:1px solid '+bc+';display:flex;gap:12px;align-items:center">'+
      '<div style="width:56px;height:56px;border-radius:16px;background:#1A2321;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+ico(I.phone,'#7E8B86',24,1.8)+'</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(o.x.p)+' <span style="font-size:12px;font-weight:500" class="muted">'+esc(o.x.r.replace('REF ',''))+'</span></span><span style="font-size:12px;font-weight:600;color:'+col+';white-space:nowrap">'+(d===null?'':'há '+d+' dias')+'</span></div>'+
      '<div style="height:6px;border-radius:99px;background:#1A2321"><div style="width:'+(d===null?0:Math.min(100,d/21*100))+'%;height:6px;border-radius:99px;background:'+col+'"></div></div>'+
      '<span style="font-size:12px" class="muted">'+(o.venda?'À venda':'Em casa')+' · '+txt+'</span></div></div>'});
  var alerta='';
  if(g.ca>0&&g.ch>g.av) alerta='Tens '+g.ch+' a chegar e só '+g.av+' à venda. Antes de comprar mais, põe à venda '+(g.ca===1?'o que está em casa':'os '+g.ca+' que estão em casa')+'.';
  else if(g.ch>g.av*2&&g.av>0) alerta='Tens '+g.ch+' a chegar e '+g.av+' à venda. Quando chegarem, publica-os logo.';
  return '<div class="glow" style="top:-160px;right:-120px;background:radial-gradient(closest-side,rgba(96,165,250,.2),rgba(96,165,250,0) 70%)"></div>'+
  '<div class="top"><a href="#" class="back" aria-label="Voltar ao início">'+ico(I.back,'#EEF2F0',20,2.2)+'</a><span class="sora" style="font-weight:700;font-size:18px">Stock</span><span style="width:44px"></span></div>'+
  '<div style="border-radius:28px;padding:22px 20px;background:linear-gradient(180deg,#111816 0%,#0C1110 100%);border:1px solid #1E2826;display:flex;flex-direction:column;gap:16px">'+
    '<div style="display:flex;flex-direction:column;gap:2px"><span class="lbl">CAPITAL EM STOCK</span><span class="sora" style="font-weight:800;font-size:40px;letter-spacing:-1.5px">'+eur(S.cap)+'</span><span style="font-size:13px" class="muted">'+S.nv.length+' artigos</span></div>'+
    '<div style="display:flex;gap:4px;height:12px">'+(g.ch?'<div style="flex:'+g.ch+';border-radius:99px;background:#60A5FA"></div>':'')+(g.ca?'<div style="flex:'+g.ca+';border-radius:99px;background:#FBBF24"></div>':'')+(g.av?'<div style="flex:'+g.av+';border-radius:99px;background:#3DDC84"></div>':'')+(g.en?'<div style="flex:'+g.en+';border-radius:99px;background:#C084FC"></div>':'')+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">'+
      '<div style="display:flex;flex-direction:column;gap:2px"><span class="sora" style="font-weight:700;font-size:22px;color:#93C5FD">'+g.ch+'</span><span style="font-size:11px" class="muted">a chegar</span></div>'+
      '<div style="display:flex;flex-direction:column;gap:2px"><span class="sora" style="font-weight:700;font-size:22px;color:#FCD34D">'+g.ca+'</span><span style="font-size:11px" class="muted">em casa</span></div>'+
      '<div style="display:flex;flex-direction:column;gap:2px"><span class="sora" style="font-weight:700;font-size:22px;color:#7CF0B0">'+g.av+'</span><span style="font-size:11px" class="muted">à venda</span></div>'+
      '<div style="display:flex;flex-direction:column;gap:2px"><span class="sora" style="font-weight:700;font-size:22px;color:#D8B4FE">'+g.en+'</span><span style="font-size:11px" class="muted">entregues</span></div></div></div>'+
  (g.en?'<div style="border-radius:22px;padding:16px 18px;background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.3);display:flex;justify-content:space-between;align-items:center">'+
    '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#D8B4FE">A receber</span><span class="sora" style="font-weight:700;font-size:22px">'+eur(g.rec)+'</span></div>'+
    '<div style="display:flex;flex-direction:column;gap:2px;align-items:flex-end"><span style="font-size:12px" class="muted">Lucro a caminho</span><span class="sora" style="font-weight:700;font-size:22px;color:#3DDC84">+'+eur(g.luc,0)+'</span></div></div>':'')+
  (S.parados.length?'<div class="hdr" style="margin-top:4px"><span class="h2">Parados há mais tempo</span><span style="font-size:12px" class="muted">'+S.parados.length+' artigos</span></div>'+cards:'')+
  (alerta?'<div style="border-radius:18px;padding:14px 16px;background:#0E1312;border:1px dashed #2A3532;display:flex;gap:10px;align-items:flex-start">'+ico(I.warn,'#FBBF24',18)+'<span style="font-size:13px;line-height:1.45;color:#C9D3CF">'+alerta+'</span></div>':'')+
  '<p style="font-size:11px;color:#5E6B66;text-align:center">Dias contados desde a compra.</p>';
}

function nivel(S){
  var i=S.nivel, N=NIVEIS[i], nx=NIVEIS[i+1], L=S.c.lucro;
  var pr=nx?Math.max(0,Math.min(100,(L-N.min)/(nx.min-N.min)*100)):100;
  var tiers='';
  NIVEIS.slice(1).forEach(function(n,k){var j=k+1, cur=j===i, lock=j>i;
    tiers+='<div style="border-radius:16px;padding:12px 6px;background:'+(cur?'#161C1C':'#111615')+';border:1px solid '+(cur?n.c:'#1E2826')+';display:flex;flex-direction:column;align-items:center;gap:4px'+(lock?';opacity:.55':'')+'"><span style="width:22px;height:22px;border-radius:8px;background:'+n.g+'"></span><span style="font-size:12px;font-weight:600">'+n.n+'</span><span style="font-size:10px;color:'+(cur?n.c:'#7E8B86')+'">'+eur(n.min,0)+'</span></div>'});
  var mes=MESES[S.hoje.getMonth()];
  var A=[
    {on:S.bestAll>=10,i:I.trophy,c:'#FBBF24',bg:'#2A2109',bd:'#4A3A12',tc:'#C9B88E',t:'Semana recorde',d:S.bestAll+' compras numa semana',dl:'10+ compras numa semana'},
    {on:!!(S.best&&S.best.l>=75),i:I.money,c:'#3DDC84',bg:'#0D2A1A',bd:'#1B4A2E',tc:'#9FC9B0',t:'Venda de ouro',d:S.best?'+'+eur(S.best.l)+' num '+esc(S.best.p):'',dl:'Uma venda com +75 € este mês'},
    {on:S.ss>=3,i:I.fire,c:'#FB923C',bg:'#2A1A0C',bd:'#3A2614',tc:'#C9B8A8',t:'Em chamas',d:S.ss+' semanas seguidas na meta',dl:'3 semanas seguidas na meta'},
    {on:S.c.v.length>=10,i:I.check,c:'#C084FC',bg:'#1E1430',bd:'#3B2A55',tc:'#BBA9D1',t:'Dez no mês',d:S.c.v.length+' vendas em '+mes,dl:'10+ vendas num mês'},
    {on:!!S.cem,i:I.crown,c:'#F472B6',bg:'#2A0F1E',bd:'#4A1D36',tc:'#D9A8C2',t:'Cem limpos',d:S.cem?'+'+eur(S.cem.l)+' num '+esc(S.cem.p):'',dl:'Uma venda com +100 € de lucro'},
    {on:S.metaAlguma,i:I.target,c:'#60A5FA',bg:'#0C1A2A',bd:'#1D3550',tc:'#A9C1DB',t:'Meta cumprida',d:'7 compras numa semana',dl:'7 compras numa semana'},
    {on:S.mesMil,i:I.star,c:'#FDE68A',bg:'#2A2409',bd:'#4A4012',tc:'#D6C98E',t:'Mês de mil',d:'1 000 € de lucro num mês',dl:'1 000 € de lucro num só mês'}
  ];
  var nOn=A.filter(function(a){return a.on}).length, cards='';
  A.forEach(function(a,k){var last=k===A.length-1;
    cards+='<div style="border-radius:20px;padding:16px;'+(a.on?'background:linear-gradient(160deg,'+a.bg+' 0%,#121312 75%);border:1px solid '+a.bd:'background:#0E1312;border:1px dashed #2A3532')+';display:flex;'+(last?'gap:14px;align-items:center;grid-column:1/-1':'flex-direction:column;gap:8px')+'">'+
      ico(a.on?a.i:I.lock,a.on?a.c:'#5E6B66',28)+'<div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:14px'+(a.on?'':';color:#9BA8A3')+'">'+a.t+'</span><span style="font-size:12px;color:'+(a.on?a.tc:'#7E8B86')+'">'+(a.on?a.d:a.dl)+'</span></div></div>'});
  return '<div class="glow" style="top:-120px;left:-45px;width:480px;height:480px;background:radial-gradient(closest-side,'+N.glow+',rgba(0,0,0,0) 70%)"></div>'+
  '<div class="top"><a href="#" class="back" aria-label="Voltar ao início">'+ico(I.back,'#EEF2F0',20,2.2)+'</a><span class="sora" style="font-weight:700;font-size:18px">O teu nível</span><span style="width:44px"></span></div>'+
  '<div style="border-radius:28px;padding:28px 20px 22px;background:linear-gradient(180deg,#151A1A 0%,#0C1110 100%);border:1px solid #262E2D;display:flex;flex-direction:column;align-items:center;gap:14px">'+
    '<div style="width:128px;height:128px;border-radius:40px;background:'+N.g+';display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px '+N.glow+'">'+ico(I.star,'#0F172A',64,1.8)+'</div>'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="lbl" style="letter-spacing:1.4px">NÍVEL '+i+'</span><span class="sora" style="font-weight:800;font-size:36px;letter-spacing:-1px">'+N.n+'</span></div>'+
    '<div style="width:100%;display:flex;flex-direction:column;gap:8px"><div style="height:10px;border-radius:99px;background:#1A2321"><div style="width:'+pr+'%;height:10px;border-radius:99px;background:linear-gradient(90deg,'+N.c+','+(nx?nx.c:N.c)+')"></div></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:12px" class="muted"><span>'+eur(L,0)+' em '+mes+'</span><span>'+(nx?nx.n+' aos '+eur(nx.min,0):'Nível máximo')+'</span></div></div>'+
    '<span style="font-size:14px;color:#FBBF24;font-weight:600;text-align:center">'+(nx?'Faltam '+eur(nx.min-L,0)+' de lucro para '+nx.n:'És uma lenda este mês')+'</span></div>'+
  '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">'+tiers+'</div>'+
  '<p style="font-size:11px;color:#5E6B66;text-align:center;margin-top:-4px">O nível é o lucro do mês e recomeça todos os meses.</p>'+
  '<div class="hdr" style="margin-top:4px"><span class="h2">Conquistas</span><span style="font-size:12px" class="muted">'+nOn+' de '+A.length+'</span></div>'+
  '<div class="g2">'+cards+'</div>';
}

var DATA=null;
function show(){
  if(!DATA) return;
  var S=calc(DATA), h=(location.hash||'').replace('#','');
  var html=h==='stock'?stock(S):h==='nivel'?nivel(S):inicio(S);
  document.getElementById('app').innerHTML='<div class="wrap">'+html+'<footer>Atualizado às '+DATA.agora.slice(11,16)+'</footer></div>';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',show);
var app=document.getElementById('app');
try{var c0=JSON.parse(localStorage.getItem('d'));if(c0&&c0.itens){DATA=c0;show()}}catch(e){}
if(!DATA) app.innerHTML='<div class="wrap"><footer style="padding:60px 0">A carregar…</footer></div>';
function load(){
  if(!K){app.innerHTML='<div class="wrap"><footer style="padding:60px 0">Falta o código de acesso no link.</footer></div>';return}
  fetch(API+'?f=json&k='+encodeURIComponent(K)).then(function(r){return r.json()}).then(function(d){
    if(d.erro){app.innerHTML='<div class="wrap"><footer style="padding:60px 0">Sem acesso. Confirma o link.</footer></div>';return}
    try{localStorage.setItem('d',JSON.stringify(d))}catch(e){}
    DATA=d; var y=window.scrollY; show(); window.scrollTo(0,y);
  }).catch(function(){});
}
load();
setInterval(load,300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
</script>
</body>
</html>
